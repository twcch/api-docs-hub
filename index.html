<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark" data-layout="h">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="API Docs Hub — 收錄各種 API 官方文件，左邊點選、右邊直接開啟，不離開本頁。">
<title>API Docs Hub · API 文件收錄站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237c8cff'/><text y='.9em' x='50%25' text-anchor='middle' font-size='58' font-family='monospace' fill='white'>{}</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="orbs" aria-hidden="true"></div>

<!-- ══════════ 頂部列 ══════════ -->
<header class="topbar">
  <button class="iconbtn menubtn" id="menuBtn" title="開啟清單" aria-label="開啟清單">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <div class="brand">
    <div class="brand__mark">{ }</div>
    <div>
      <div class="brand__name">API Docs Hub</div>
      <div class="brand__sub">API 文件收錄站</div>
    </div>
  </div>

  <div class="topbar__spacer"></div>

  <button class="searchbtn" id="searchBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <span class="searchbtn__t">快速搜尋文件…</span>
    <span class="kbd" id="kbdHint">⌘K</span>
  </button>

  <button class="iconbtn" id="addBtn" title="新增自己的文件連結" aria-label="新增文件">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <button class="iconbtn" id="layoutBtn" title="切換左右／上下分割" aria-label="切換分割方向">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 4v16" class="lay-h"/><path d="M3 11h18" class="lay-v"/></svg>
  </button>

  <button class="iconbtn" id="themeBtn" title="切換深色／淺色" aria-label="切換主題">
    <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<!-- ══════════ 分割視窗 ══════════ -->
<div class="split" id="split">

  <!-- ── 左：文件清單 ── -->
  <aside class="pane pane--list" id="listPane">
    <div class="listhead">
      <div class="sfield" id="sfield">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="filterInput" type="search" placeholder="搜尋 API 名稱、分類或標籤…" autocomplete="off" spellcheck="false">
        <button class="sfield__clear" id="filterClear" aria-label="清除">✕</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <nav class="list" id="list" aria-label="API 文件清單"></nav>

    <div class="listfoot">
      <span class="dot"></span>
      <span id="footStat">—</span>
      <button class="listfoot__add" id="addBtn2">＋ 新增文件</button>
    </div>
  </aside>

  <!-- ── 拖曳分隔線 ── -->
  <div class="gutter" id="gutter" role="separator" aria-orientation="vertical" tabindex="0" title="拖曳調整視窗大小（雙擊還原）">
    <span class="gutter__grip"></span>
  </div>

  <!-- ── 右：文件顯示區 ── -->
  <section class="pane pane--view" id="viewPane">

    <div class="doctabs" id="docTabs"></div>

    <div class="viewbar" id="viewBar" hidden>
      <span class="viewbar__ico" id="vbIco">📄</span>
      <div class="viewbar__meta">
        <div class="viewbar__name" id="vbName"></div>
        <div class="viewbar__url" id="vbUrl"></div>
      </div>
      <div class="viewbar__acts">
        <button class="iconbtn sm" id="favBtn"  title="收藏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8Z"/></svg>
        </button>
        <button class="iconbtn sm" id="popBtn" title="開成可並排的獨立視窗">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M9 6V4.5A1.5 1.5 0 0 1 10.5 3H19.5A1.5 1.5 0 0 1 21 4.5v9a1.5 1.5 0 0 1-1.5 1.5H18"/></svg>
        </button>
        <button class="iconbtn sm" id="markBtn" title="手動更正這個站台能不能被內嵌">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        </button>
        <button class="iconbtn sm" id="reloadBtn" title="重新載入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3v5h-5"/></svg>
        </button>
        <button class="iconbtn sm" id="wideBtn" title="放大顯示區（隱藏左側清單）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 0 0-1 1v4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4M15 20h4a1 1 0 0 0 1-1v-4"/></svg>
        </button>
        <a class="iconbtn sm" id="openBtn" href="#" target="_blank" rel="noopener" title="在新分頁開啟">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </a>
      </div>
    </div>

    <div class="stage" id="stage">
      <!-- 歡迎畫面 -->
      <div class="welcome" id="welcome">
        <div class="welcome__inner">
          <div class="welcome__mark">{ }</div>
          <h1>把 API 文件<span class="grad">收在同一個視窗</span></h1>
          <p>左邊點一下，官方文件就直接載入右邊這塊區域，不換頁、不轉跳。<br>中間那條分隔線可以拖曳，也能切換成上下分割。</p>
          <div class="welcome__stat" id="welcomeStat"></div>

          <div class="welcome__hot" id="welcomeHot"></div>

          <div class="welcome__tips">
            <div class="wtip"><span class="wtip__k">⌘K</span> 快速搜尋任一份文件</div>
            <div class="wtip"><span class="wtip__k">拖曳</span> 中間分隔線調整版面</div>
            <div class="wtip"><span class="wtip__k">＋</span> 新增自己常看的文件網址</div>
          </div>
        </div>
      </div>
      <!-- iframe 由 JS 動態插入此處 -->
    </div>

    <div class="loadbar" id="loadBar"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>

<!-- ══════════ 命令面板 ══════════ -->
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="快速搜尋">
  <div class="palette__box">
    <div class="palette__field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="paletteInput" type="text" placeholder="搜尋 API 文件…" autocomplete="off" spellcheck="false">
      <span class="kbd">ESC</span>
    </div>
    <div class="palette__list" id="paletteList"></div>
    <div class="palette__foot">
      <span><span class="kbd">↑↓</span> 選擇</span>
      <span><span class="kbd">↵</span> 在右側開啟</span>
      <span><span class="kbd">⌘↵</span> 開新分頁</span>
    </div>
  </div>
</div>

<!-- ══════════ 新增文件 ══════════ -->
<div class="modal" id="addModal" role="dialog" aria-modal="true" aria-label="新增文件">
  <form class="modal__box" id="addForm">
    <div class="modal__head">
      <h3>新增文件連結</h3>
      <button type="button" class="iconbtn sm" id="addClose" aria-label="關閉">✕</button>
    </div>
    <div class="modal__body">
      <label class="field">
        <span>文件名稱</span>
        <input id="fName" required placeholder="例如：Notion API">
      </label>
      <label class="field">
        <span>文件網址</span>
        <input id="fUrl" required type="url" placeholder="https://developers.example.com/docs">
      </label>
      <div class="field__row">
        <label class="field">
          <span>分類</span>
          <select id="fCat"></select>
        </label>
        <label class="field field--sm">
          <span>圖示</span>
          <input id="fIcon" maxlength="4" placeholder="📘">
        </label>
      </div>
      <label class="field">
        <span>一句話說明<i>（可略）</i></span>
        <input id="fDesc" placeholder="這份文件是做什麼用的">
      </label>
      <p class="modal__note">自訂項目只存在你這台瀏覽器的 localStorage，不會上傳到任何地方。</p>
    </div>
    <div class="modal__foot">
      <button type="button" class="btn" id="addCancel">取消</button>
      <button type="submit" class="btn btn--accent">加入清單</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
